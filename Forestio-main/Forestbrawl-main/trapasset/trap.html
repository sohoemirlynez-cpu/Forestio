<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IO Oyunu - PNG Uyumlu Tuzak Motoru</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .header h1 { color: #38bdf8; font-size: 1.4rem; text-align: center; margin-bottom: 5px; }
        .header p { color: #94a3b8; font-size: 0.85rem; text-align: center; }

        canvas {
            background: #020617;
            border: 2px solid #334155;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #dc2626; }
        button:active { transform: scale(0.97); }

        .hint { font-size: 0.75rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>IO Oyun Motoru - PNG Tuzağı</h1>
            <p>İndirdiğiniz PNG katmanlarıyla çalışan animasyonlu sistem</p>
        </div>

        <!-- Oyun Alanı -->
        <canvas id="gameCanvas" width="500" height="400"></canvas>

        <div class="controls">
            <button id="triggerBtn">Tuzağı Tetikle</button>
        </div>

        <div class="hint">
            Not: PNG dosyalarınızın kodla aynı klasörde olduğundan emin olun.<br>
            (base_idle.png, core_idle.png, particle_idle.png vb.)
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const triggerBtn = document.getElementById('triggerBtn');

        // --- 1. PNG VARLIKLARINI (ASSETS) YÜKLEME ---
        const images = {};
        const assetFiles = {
            baseIdle: 'base_idle.png',
            baseActive: 'base_active.png',
            coreIdle: 'core_idle.png',
            coreActive: 'core_active.png',
            particleIdle: 'particle_idle.png',
            particleActive: 'particle_active.png'
        };

        let loadedImagesCount = 0;
        const totalImages = Object.keys(assetFiles).length;
        let assetsReady = false;

        for (let key in assetFiles) {
            images[key] = new Image();
            images[key].src = assetFiles[key];
            images[key].onload = () => {
                loadedImagesCount++;
                if (loadedImagesCount === totalImages) {
                    assetsReady = true;
                }
            };
            images[key].onerror = () => {
                console.warn(`Uyarı: ${assetFiles[key]} yüklenemedi. Lütfen dosyanın klasörde olduğundan emin olun.`);
            };
        }

        // --- 2. TUZAK ENTITY (NESNE) SINIFI ---
        class Trap {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.isTriggered = false;
                this.triggerTimer = 0;
                this.time = 0;
                this.coreScale = 1.0;

                // Etrafa saçılacak partiküllerin listesi
                this.particles = [];
                for (let i = 0; i < 30; i++) {
                    this.particles.push({
                        angle: Math.random() * Math.PI * 2,
                        distance: Math.random() * 45,
                        speed: Math.random() * 0.04 + 0.02
                    });
                }
            }

            // Tuzağı tetikleme fonksiyonu
            activate() {
                this.isTriggered = true;
                this.triggerTimer = 90; // 90 frame (yaklaşık 1.5 saniye) aktif kalır
            }

            update() {
                this.time += 0.08;

                // Süre sayacı
                if (this.triggerTimer > 0) {
                    this.triggerTimer--;
                    if (this.triggerTimer <= 0) {
                        this.isTriggered = false;
                    }
                }

                // Nabız (Scale) Animasyon Efekti
                let targetScale = this.isTriggered ? 1.35 + Math.sin(this.time * 3) * 0.15 : 1.0 + Math.sin(this.time) * 0.05;
                this.coreScale += (targetScale - this.coreScale) * 0.15;

                // Partikül Yörünge Güncellemesi
                this.particles.forEach(p => {
                    p.angle += p.speed * (this.isTriggered ? 2.5 : 1.0);
                });
            }

            draw(context) {
                // Hangi PNG'lerin çizileceğini belirle (Aktif veya Bekleme)
                const baseImg = this.isTriggered ? images.baseActive : images.baseIdle;
                const coreImg = this.isTriggered ? images.coreActive : images.coreIdle;
                const partImg = this.isTriggered ? images.particleActive : images.particleIdle;

                // 1. KATMAN: Taban (Base) PNG Çizimi (Merkezlenmiş olarak 256x256)
                if (baseImg && baseImg.complete) {
                    context.drawImage(baseImg, this.x - 128, this.y - 128, 256, 256);
                }

                // 2. KATMAN: Partikül (Particle) PNG Çizimleri
                if (partImg && partImg.complete) {
                    this.particles.forEach(p => {
                        let px = this.x + Math.cos(p.angle) * p.distance;
                        let py = this.y + Math.sin(p.angle) * p.distance;
                        context.drawImage(partImg, px - 16, py - 16, 32, 32);
                    });
                }

                // 3. KATMAN: Merkez (Core) PNG Çizimi (Büyüyüp Küçülme Efektiyle)
                if (coreImg && coreImg.complete) {
                    context.save();
                    context.translate(this.x, this.y);
                    context.scale(this.coreScale, this.coreScale);
                    context.drawImage(coreImg, -32, -32, 64, 64);
                    context.restore();
                }
            }
        }

        // Oyundaki tuzak nesnesini oluştur
        const myTrap = new Trap(canvas.width / 2, canvas.height / 2);

        // Kullanıcı etkileşimleri
        triggerBtn.addEventListener('click', () => myTrap.activate());
        canvas.addEventListener('click', () => myTrap.activate());

        // --- 3. ANA OYUN DÖNGÜSÜ ---
        function gameLoop() {
            // Ekranı temizle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zemin Izgara Çizgileri (.io oyunlarına benzer grid dokusu)
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Tuzağı güncelle ve çiz
            myTrap.update();
            myTrap.draw(ctx);

            // Resimler henüz yüklenmediyse bilgilendirme yazısı göster
            if (!assetsReady) {
                ctx.fillStyle = '#f8fafc';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("PNG Dosyaları Bekleniyor...", canvas.width / 2, canvas.height / 2);
            }

            requestAnimationFrame(gameLoop);
        }

        // Döngüyü başlat
        gameLoop();
    </script>
</body>
</html>
